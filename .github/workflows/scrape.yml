name: Travian 村庄数据定时抓取

on:
  schedule:
    # cron 是 UTC 时间。这里设为每小时的第 5 分钟跑一次，可自行调整。
    # 例如改成 "*/30 * * * *" 就是每 30 分钟一次。
    # 注意：抓取频率越高，越容易被判定为"非人类操作模式"，请谨慎设置。
    - cron: "5 * * * *"
  workflow_dispatch: {}   # 也允许在 GitHub 网页上手动点"Run workflow"触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并写入 Google Sheets
        env:
          TRAVIAN_BASE_URL: ${{ secrets.TRAVIAN_BASE_URL }}
          TRAVIAN_COOKIE: ${{ secrets.TRAVIAN_COOKIE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scrape_and_log.py
