name: Travian CI (import／unittest／check_arch／check_contracts)

# 原 auto_build.yml 的檢查步驟搬到這裡（A6b 後 auto_build.yml 只負責執行 bot）。
on:
  push: {}
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 第三方套件：parsers 用 beautifulsoup4。不裝專案本身（D-10）；playwright、gspread 都在函式內才 import。
      - name: 安裝第三方套件（bs4）
        run: python -m pip install beautifulsoup4

      - name: import travian_bot（D-10，全部模組）
        run: |
          python - <<'PYEOF'
          import importlib, pkgutil
          import travian_bot
          names = sorted(m.name for m in pkgutil.walk_packages(travian_bot.__path__, "travian_bot."))
          for n in names:
              importlib.import_module(n)
          print("import OK", travian_bot.__file__)
          print(len(names), "modules:", ", ".join(n.rsplit(".", 1)[-1] for n in names))
          PYEOF

      - name: python -m unittest（單元測試，無網路、無 Secrets）
        run: python -m unittest discover -s tests -t . -v

      - name: check_arch（依賴方向、單一出口）
        run: python tools/check_arch.py --expect-wp A1a-1,A1a-2,A1b,A2a-1,A2a-2a,A2a-2b,A2b,A3a,A4a,A4b-1,A4b-2,A6a1,A5a,A3b,A6a2,A3c,A5b,A6a2b,A6b --strict

      - name: check_contracts（契約與範例）
        run: python tools/check_contracts.py
