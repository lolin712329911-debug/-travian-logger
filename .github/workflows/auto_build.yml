name: Travian auto build

# 檔名、main 分支、workflow_dispatch 不可改：Apps Script triggerTravian 以 workflow_dispatch 打這支（A-7）。
on:
  workflow_dispatch: {}

concurrency:
  group: travian-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # session 快取（A-8：key 前綴 travian-session-、檔名 travian_session.json）。
      # restore 與 save 分開：bot 失敗（結束碼 1）時仍要存回最新登入狀態。
      - name: 還原 session 快取
        uses: actions/cache/restore@v4
        with:
          path: travian_session.json
          key: travian-session-${{ github.run_id }}
          restore-keys: travian-session-

      - name: 執行 bot
        env:
          # GA 通過前維持 "1"（寫入類 mode 一律降 dry）；GA 後才改 "0"
          DRY_RUN: "1"
          TRAVIAN_SEED_COOKIE_S2: ${{ secrets.TRAVIAN_SEED_COOKIE_S2 }}
          GOOGLE_SHEET_ID_S2: ${{ secrets.GOOGLE_SHEET_ID_S2 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m travian_bot.app.main

      - name: 存 session 快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: travian_session.json
          key: travian-session-${{ github.run_id }}
