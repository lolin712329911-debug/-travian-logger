name: Travian import check (branch only)

on:
  workflow_dispatch: {}   # 在 Actions 頁面選「測試分支」後按 Run workflow

concurrency:
  group: travian-import-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 第三方套件：parsers 用 beautifulsoup4（A2a-1 起）。不裝專案本身（D-10 禁止 pip install -e），
      # 也不整份裝 requirements.txt（playwright、gspread 這裡用不到）。
      - name: 安裝第三方套件（parsers 用 bs4）
        run: python -m pip install beautifulsoup4

      # D-10 驗證：只執行 import，無 PYTHONPATH、無 pip install -e
      # 自動掃描 travian_bot 底下所有模組，新增模組不必再改這裡
      - name: import travian_bot（D-10，全部模組）
        run: |
          python - <<'PYEOF'
          import importlib, pkgutil
          import travian_bot
          names = sorted(m.name for m in pkgutil.walk_packages(travian_bot.__path__, "travian_bot."))
          for n in names:
              importlib.import_module(n)
          print("import OK", travian_bot.__file__)
          print(len(names), "modules:", ", ".join(n.rsplit(".", 1)[-1] for n in names))
          PYEOF

      - name: python -m unittest（單元測試，無網路、無 Secrets）
        run: python -m unittest discover -s tests -t . -v

      # 每個 WP 驗收必跑；A2a-2b 加進來（之後每完成一個 WP 就在 --expect-wp 末尾追加）
      - name: check_arch（依賴方向、單一出口）
        run: python tools/check_arch.py --expect-wp A1a-1,A1a-2,A1b,A2a-1,A2a-2a,A2a-2b,A2b,A3a,A4a,A4b-1,A4b-2,A6a1,A5a,A3b,A6a2 --strict

      - name: check_contracts（契約與範例）
        run: python tools/check_contracts.py
