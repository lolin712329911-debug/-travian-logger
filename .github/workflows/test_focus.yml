name: test-focus
# 手動觸發：Actions 分頁 → test-focus → Run workflow
# 注意：這個檔案要在預設分支上，Run workflow 按鈕才會出現。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "offline＝只跑離線測試；live_read＝再連真實伺服器只讀；live_switch＝再真的切一次（會自動切回）"
        type: choice
        default: offline
        options: [offline, live_read, live_switch]
      to:
        description: "live_switch 要切到哪個類型（必須和目前不同）：0平均 1木 2磚 3鐵 4穀"
        type: choice
        default: "2"
        options: ["0", "1", "2", "3", "4"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. 離線測試：不需要 Cookie、不連網路、不裝任何套件
      - name: 離線測試 test_focus.py
        run: python test_focus.py

      # 2. 還原 auto_build 存的 session（我沒看到 auto_build.yml，key 是猜的；
      #    對不到只會是 cache miss，會退回用 TRAVIAN_SEED_COOKIE）
      - name: 還原 session cache
        if: inputs.mode != 'offline'
        uses: actions/cache/restore@v4
        with:
          path: travian_state.json
          key: travian-state-none
          restore-keys: travian-state-

      - name: 安裝 playwright（只用 API request，不需要瀏覽器）
        if: inputs.mode != 'offline'
        run: pip install playwright

      # 3a. 只讀：印出目前加成，不送任何 POST
      - name: 真實伺服器：只讀
        if: inputs.mode == 'live_read'
        env:
          TRAVIAN_BASE_URL: ${{ secrets.TRAVIAN_BASE_URL || vars.TRAVIAN_BASE_URL }}
          TRAVIAN_SEED_COOKIE: ${{ secrets.TRAVIAN_SEED_COOKIE }}
        run: python test_focus_live.py

      # 3b. 切一次再切回
      - name: 真實伺服器：切換並還原
        if: inputs.mode == 'live_switch'
        env:
          TRAVIAN_BASE_URL: ${{ secrets.TRAVIAN_BASE_URL || vars.TRAVIAN_BASE_URL }}
          TRAVIAN_SEED_COOKIE: ${{ secrets.TRAVIAN_SEED_COOKIE }}
          TO: ${{ inputs.to }}
        run: python test_focus_live.py --to "$TO" --yes
